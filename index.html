<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centoventi's GitHub Page</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      min-height: 100%;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        linear-gradient(rgba(0, 20, 60, 0.12), rgba(0, 20, 60, 0.36)),
        url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=85") center / cover fixed no-repeat;
      color: white;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 2rem;
      background: rgba(0, 0, 0, 0.35);
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: 1.25rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    header nav {
      display: flex;
      gap: 1rem;
    }

    header a {
      color: inherit;
      text-decoration: none;
    }

    header a:hover {
      text-decoration: underline;
    }

    .settings {
      position: relative;
    }

    .settings-button {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      min-height: 2.25rem;
      padding: 0.35rem 0.65rem;
      border: 1px solid currentColor;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.35);
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    .settings-button:hover,
    .settings-button:focus-visible {
      background: rgba(255, 255, 255, 0.15);
      outline: none;
    }

    .settings-icon {
      font-size: 1.1rem;
      line-height: 1;
    }

    .settings-label {
      font-size: 0.95rem;
    }

    .settings-menu {
      position: absolute;
      top: calc(100% + 0.75rem);
      right: 0;
      display: none;
      min-width: 180px;
      padding: 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 0.5rem;
      background: rgba(0, 0, 0, 0.92);
      box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.35);
      color: white;
    }

    .settings.open .settings-menu {
      display: block;
    }

    .settings-menu button {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 0;
      border-radius: 0.35rem;
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .settings-menu button:hover,
    .settings-menu button:focus-visible {
      background: rgba(255, 255, 255, 0.12);
      outline: none;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>
  <header>
    <h1>My GitHub Page</h1>
    <div class="header-actions">
      <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
      </nav>
      <div class="settings">
        <button class="settings-button" type="button" aria-label="Open settings" aria-expanded="false">
          <span class="settings-icon" aria-hidden="true">⚙</span>
          <span class="settings-label">Settings</span>
        </button>
        <div class="settings-menu" role="menu">
          <button type="button" role="menuitem" id="theme-toggle">Toggle light theme</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <h2>Welcome</h2>
    <p>Welcome to my personal website. Note that this is still in testing and may undergo frequent changes.</p>
  </main>

  <script>
    const settings = document.querySelector('.settings');
    const settingsButton = document.querySelector('.settings-button');
    const themeToggle = document.querySelector('#theme-toggle');

    settingsButton.addEventListener('click', () => {
      const isOpen = settings.classList.toggle('open');
      settingsButton.setAttribute('aria-expanded', String(isOpen));
    });

    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.dataset.theme !== 'light';
      if (isDark) {
        document.documentElement.dataset.theme = 'light';
        document.documentElement.style.colorScheme = 'light';
        themeToggle.textContent = 'Toggle dark theme';
      } else {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.style.colorScheme = 'dark';
        themeToggle.textContent = 'Toggle light theme';
      }
      settings.classList.remove('open');
      settingsButton.setAttribute('aria-expanded', 'false');
    });

    document.addEventListener('click', (event) => {
      if (!settings.contains(event.target)) {
        settings.classList.remove('open');
        settingsButton.setAttribute('aria-expanded', 'false');
      }
    });
  </script>
</body>
</html>
