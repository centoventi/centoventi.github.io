<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centoventi's github page</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      min-height: 100%;
      background-color: #000000;
      background-image: linear-gradient(135deg, #000000 0%, #0033cc 55%, #1685ff 100%);
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: cover;
    }

    :root.light-mode {
      color-scheme: light;
      background-color: #ffffff;
      background-image: linear-gradient(135deg, #ffffff 0%, #83c4ff 55%, #0066cc 100%);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: linear-gradient(135deg, #000000 0%, #0033cc 55%, #1685ff 100%) fixed;
    }

    html.light-mode {
      background: linear-gradient(135deg, #ffffff 0%, #83c4ff 55%, #0066cc 100%) fixed;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: transparent;
      color: white;
    }

    html.light-mode body {
      color: #061a33;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 2rem;
      background: rgba(0, 0, 0, 0.35);
      color: white;
    }

    html.light-mode header {
      background: rgba(255, 255, 255, 0.65);
      color: #061a33;
    }

    header h1 {
      margin: 0;
      font-size: 1.25rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    header nav {
      display: flex;
      gap: 1rem;
    }

    header a {
      color: inherit;
      text-decoration: none;
    }

    header a:hover {
      text-decoration: underline;
    }

    .settings {
      position: relative;
    }

    .settings-button {
      display: grid;
      place-items: center;
      width: 2.25rem;
      height: 2.25rem;
      border: 1px solid currentColor;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.35);
      color: inherit;
      font-size: 1.1rem;
      cursor: pointer;
    }

    html.light-mode .settings-button {
      background: rgba(255, 255, 255, 0.7);
    }

    .settings-button:hover,
    .settings-button:focus-visible {
      background: rgba(255, 255, 255, 0.15);
      outline: none;
    }

    .settings-menu {
      position: absolute;
      top: calc(100% + 0.75rem);
      right: 0;
      display: none;
      min-width: 180px;
      padding: 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 0.5rem;
      background: rgba(0, 0, 0, 0.92);
      box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.35);
      color: white;
    }

    html.light-mode .settings-menu {
      border-color: rgba(6, 26, 51, 0.15);
      background: rgba(255, 255, 255, 0.96);
      color: #061a33;
    }

    .settings.open .settings-menu {
      display: block;
    }

    .settings-menu button {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 0;
      border-radius: 0.35rem;
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .settings-menu button:hover,
    .settings-menu button:focus-visible {
      background: rgba(128, 128, 128, 0.18);
      outline: none;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>My GitHub Page</h1>
    <div class="header-actions">
      <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
      </nav>
      <div class="settings">
        <button class="settings-button" type="button" aria-label="Open settings" aria-expanded="false">⚙</button>
        <div class="settings-menu" role="menu">
          <button type="button" role="menuitem" id="theme-toggle">Toggle light theme</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <h2>Welcome</h2>
    <p>Welcome to my personal website. Note that this is still in testing and may undergo frequent changes.</p>
  </main>

  <script>
    const settings = document.querySelector('.settings');
    const settingsButton = document.querySelector('.settings-button');
    const themeToggle = document.querySelector('#theme-toggle');
    const root = document.documentElement;

    settingsButton.addEventListener('click', () => {
      const isOpen = settings.classList.toggle('open');
      settingsButton.setAttribute('aria-expanded', String(isOpen));
    });

    themeToggle.addEventListener('click', () => {
      const isLight = root.classList.toggle('light-mode');
      themeToggle.textContent = isLight ? 'Toggle dark theme' : 'Toggle light theme';
      settings.classList.remove('open');
      settingsButton.setAttribute('aria-expanded', 'false');
    });

    document.addEventListener('click', (event) => {
      if (!settings.contains(event.target)) {
        settings.classList.remove('open');
        settingsButton.setAttribute('aria-expanded', 'false');
      }
    });
  </script>
</body>
</html>
