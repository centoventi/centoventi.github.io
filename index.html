<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My GitHub Page</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      min-height: 100%;
      background-color: #000000;
      background-image: linear-gradient(135deg, #000000 0%, #0033cc 55%, #1685ff 100%);
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: cover;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: linear-gradient(135deg, #000000 0%, #0033cc 55%, #1685ff 100%) fixed;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: transparent;
      color: white;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 2rem;
      background: rgba(0, 0, 0, 0.35);
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: 1.25rem;
    }

    header nav {
      display: flex;
      gap: 1rem;
    }

    header a {
      color: white;
      text-decoration: none;
    }

    header a:hover {
      text-decoration: underline;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>My GitHub Page</h1>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
    </nav>
  </header>

  <main>
    <h2>Welcome</h2>
    <p>Welcome to my personal website. Note that this is still in testing and may unergo frequent changes.</p>
  </main>
</body>
</html>
