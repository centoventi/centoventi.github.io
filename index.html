<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My GitHub Page</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #000000, #0066ff);
      background-attachment: fixed;
      color: white;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 2rem;
      background: rgba(0, 0, 0, 0.65);
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: 1.25rem;
    }

    header nav {
      display: flex;
      gap: 1rem;
    }

    header a {
      color: white;
      text-decoration: none;
    }

    header a:hover {
      text-decoration: underline;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>My GitHub Page</h1>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
    </nav>
  </header>

  <main>
    <h2>Welcome</h2>
    <p>This is my GitHub Pages website.</p>
  </main>
</body>
</html>
